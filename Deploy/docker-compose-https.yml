#Old version dont use
version: "3.9"
services:
  nginx_con:
    image: nginx:1.23-alpine
    container_name: nginx_egor_bot
    ports:
     - "443:443"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - "./nginx.confd/nginx-https.conf:/etc/nginx/conf.d/default.conf"
      - "./ssl/nginx_key.key:/etc/ssl/private/nginx_key.key"
      - "./ssl/nginx_cert.pem:/etc/ssl/certs/nginx_cert.pem"
        # create ssl certs
        #https://core.telegram.org/bots/self-signed
    depends_on:
      - bot
      - db

  bot:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: egor_bot
    expose:
      - "5001"
    env_file:
      - "../.env"
    working_dir: /app
    depends_on:
      - db

  db:
    image: mysql:latest
    container_name: db_mysql_egor
    expose:
      - "3300"
    env_file:
      - "../.env"
    volumes:
      - "./db_dump:/docker-entrypoint-initdb.d"