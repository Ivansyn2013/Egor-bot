# Production nginx for FODMAP stack (no Telegram bot in this compose).
# Routes: frontend SPA + bot_admin API/admin + media + ACME.

upstream admin_bot_upstream {
    server admin_bot:5001;
}

upstream frontend_upstream {
    server frontend:80;
}

# ---------------------------------------------------------------------------
# Shared security snippets (included via map / repeated in server blocks)
# ---------------------------------------------------------------------------

map $request_uri $blocked_probe {
    default 0;
    ~*(^|/)\.env($|/|\?) 1;
    ~*(^|/)\.git($|/|\?) 1;
    ~*(^|/)\.svn($|/|\?) 1;
    ~*(^|/)\.hg($|/|\?) 1;
    ~*(^|/)\.DS_Store($|/|\?) 1;
    ~*(^|/)docker-compose 1;
    ~*(^|/)Dockerfile 1;
    ~*(^|/)manage\.py 1;
    ~*(^|/)requirements\.txt 1;
    ~*(^|/)package-lock\.json 1;
    ~*\.(bak|old|orig|swp|sql|sqlite3?)$ 1;
    ~*(^|/)wp-admin 1;
    ~*(^|/)wp-login\.php 1;
    ~*(^|/)phpmyadmin 1;
    ~*(^|/)adminer 1;
    ~*(^|/)actuator 1;
    ~*(^|/)server-status 1;
}

server {
    listen 80;
    server_name fodmap.moscow www.fodmap.moscow dev.fodmap.moscow www.dev.fodmap.moscow;

    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen 8443 ssl http2;
    server_name fodmap.moscow www.fodmap.moscow dev.fodmap.moscow www.dev.fodmap.moscow;

    server_tokens off;
    include /etc/nginx/mime.types;

    ssl_certificate /etc/letsencrypt/live/fodmap.moscow/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fodmap.moscow/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 20m;

    access_log /var/log/nginx/fodmap_access.log;
    error_log /var/log/nginx/fodmap_error.log warn;

    # Block common probe / secret-file requests
    if ($blocked_probe) {
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Django REST API
    location ^~ /api/ {
        proxy_pass http://admin_bot_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        proxy_read_timeout 120s;
        # Ensure trailing slash for Django APPEND_SLASH
        rewrite ^/api/(.*[^/])$ /api/$1/ break;
    }

    # Django admin (staff-only; created manually — no public registration)
    location ^~ /admin/ {
        proxy_pass http://admin_bot_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }

    # Legacy admin path alias (optional compatibility)
    location ^~ /admin_page/ {
        rewrite ^/admin_page/(.*)$ /admin/$1 break;
        proxy_pass http://admin_bot_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    # Collected Django static files
    location ^~ /static/ {
        alias /www/admin_static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Uploaded media
    location ^~ /media/ {
        alias /www/media/;
        autoindex off;
        access_log off;
        expires 7d;
    }

    # Frontend SPA (React)
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}
