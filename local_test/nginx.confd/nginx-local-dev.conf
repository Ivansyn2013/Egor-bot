# Nginx конфигурация для локальной разработки
# Backend и Frontend запускаются на хосте, nginx и DB в контейнере

upstream backend_local {
    # Backend запущен на хосте
    server host.docker.internal:5000;
}

upstream admin_local {
    # Admin backend запущен на хосте
    server host.docker.internal:5001;
}

upstream frontend_local {
    # Frontend dev server (Vite) запущен на хосте
    server host.docker.internal:5173;
}

server {
    listen 80;
    server_name localhost;
    include /etc/nginx/mime.types;

    # Логирование для отладки
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log debug;

    # Увеличенные таймауты для дебага
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;

    # Frontend (главная страница и статика)
    location / {
        proxy_pass http://frontend_local;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Для HMR (Hot Module Replacement) Vite
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    location ^~ /api/ {
        proxy_pass http://backend_local;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Для отладки
        add_header X-Debug-Backend "local-backend" always;
    }

    # Admin panel
    location ^~ /admin_page/ {
        proxy_pass http://admin_local;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Для отладки
        add_header X-Debug-Backend "local-admin" always;
    }

    # Static files для admin (если используется)
    location ^~ /admin_page/static/ {
        proxy_pass http://admin_local;
        proxy_set_header Host $host;
    }

    # Media files (если нужны для разработки)
    location ^~ /media/ {
        proxy_pass http://backend_local;
        proxy_set_header Host $host;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "nginx ok\n";
        add_header Content-Type text/plain;
    }
}
