# Production stack entrypoint.
# Usage (from this directory):
#   docker compose -f docker-compose.master.yaml --env-file .env up -d --build
#
# Paths to sibling projects come from .env:
#   ADMIN_APP_PATH, FRONTEND_APP_PATH, MEDIA_HOST_PATH
#
# Bot service is intentionally NOT started in this version.

services:
  nginx:
    image: nginx:1.23-alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    volumes:
      - "./Deploy/nginx.confd/nginx-master.conf:/etc/nginx/conf.d/default.conf:ro"
      - "${MEDIA_HOST_PATH}:/www/media:ro"
      - "./ssl/certbot/conf:/etc/letsencrypt:ro"
      - "./ssl/certbot/www:/var/www/certbot:ro"
      - admin_static:/www/admin_static:ro
      - "./Deploy/html_errors:/usr/share/nginx/html:ro"
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    depends_on:
      - certbot
      - admin_bot
      - frontend
    restart: unless-stopped
    networks:
      - egor_bot_network

  certbot:
    image: certbot/certbot
    container_name: certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    volumes:
      - "./ssl/certbot/conf:/etc/letsencrypt"
      - "./ssl/certbot/www:/var/www/certbot"
    restart: unless-stopped
    networks:
      - egor_bot_network

  db:
    image: mysql:8.0.32-debian
    container_name: db_mysql_egor
    cap_add:
      - SYS_NICE
    expose:
      - "3306"
    env_file:
      - ".env"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      # MySQL only executes files directly under initdb.d (not nested dirs)
      - "./Deploy/mysql-init/00-create-databases.sh:/docker-entrypoint-initdb.d/00-create-databases.sh:ro"
      - "./Deploy/db_dump:/docker-entrypoint-initdb.d/dumps:ro"
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - egor_bot_network

  redis:
    image: redis:7-alpine
    container_name: redis_egor
    expose:
      - "6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - egor_bot_network

  admin_bot:
    build:
      context: ${ADMIN_APP_PATH}
      dockerfile: Dockerfile
    container_name: admin_bot
    working_dir: /app
    env_file:
      - ".env"
    environment:
      DEBUG: "False"
      DEVELOP: "False"
      DJANGO_SETTINGS_MODULE: bot_admin.develop_settings
      DB_HOST: db
      DB_PORT: "3306"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "False"
      REDIS_URL: redis://redis:6379/0
    volumes:
      - "${MEDIA_HOST_PATH}:/app/media"
      - admin_static:/app/static
    expose:
      - "5001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 5001), 5); s.close()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/app/shell_scripts/entrypoint.sh"]
    command:
      - gunicorn
      - --workers=4
      - --bind=0.0.0.0:5001
      - --access-logfile=-
      - --error-logfile=-
      - bot_admin.wsgi:application
    restart: unless-stopped
    networks:
      - egor_bot_network

  celery:
    build:
      context: ${ADMIN_APP_PATH}
      dockerfile: Dockerfile
    container_name: celery_worker
    working_dir: /app
    env_file:
      - ".env"
    environment:
      DEBUG: "False"
      DEVELOP: "False"
      DJANGO_SETTINGS_MODULE: bot_admin.develop_settings
      DB_HOST: db
      DB_PORT: "3306"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "False"
      REDIS_URL: redis://redis:6379/0
    volumes:
      - "${MEDIA_HOST_PATH}:/app/media"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      admin_bot:
        condition: service_healthy
    # No migrations here — admin_bot entrypoint owns schema; worker only runs tasks
    entrypoint: ["celery"]
    command:
      - -A
      - bot_admin
      - worker
      - --loglevel=info
      - --concurrency=2
    restart: unless-stopped
    networks:
      - egor_bot_network

  frontend:
    build:
      context: ${FRONTEND_APP_PATH}
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_BACKEND_MEDIA: ${VITE_BACKEND_MEDIA:-/media/}
    container_name: frontend
    expose:
      - "80"
    depends_on:
      - admin_bot
    restart: unless-stopped
    networks:
      - egor_bot_network

volumes:
  admin_static:
  mysql_data:
  redis_data:

networks:
  egor_bot_network:
    name: egor_bot_network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.1.1.0/24
